name: ZLUDA
on:
  workflow_dispatch:
  push:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE: release-lto
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  SCCACHE_MAX_FRAME_LENGTH: "104857600"  # 100 MB
  ROCM_VERSION: "6.3.4"
  AMDGPU_VERSION: "31.20"

jobs:
  build_linux:
    if: github.ref != 'refs/heads/experiment/physx-diagnostics'
    name: Build (Linux)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: jlumbroso/free-disk-space@v1.3.1
    - uses: actions/checkout@v4
      # fetch-depth and fetch-tags are required to properly tag pre-release builds
      with:
        fetch-depth: 0
        fetch-tags: true
        lfs: true
        submodules: true
    - name: Install ROCm
      run: sudo bash .github/workflows/rocm_setup_build.sh ${{ env.ROCM_VERSION }}
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9
    - name: Build
      # https://github.com/actions/upload-artifact/issues/39
      run: |
        cargo xtask zip --profile ${{ env.CARGO_PROFILE }}
        mkdir target/${{ env.CARGO_PROFILE }}/zluda
        tar -xzf target/${{ env.CARGO_PROFILE }}/zluda.tar.gz -C target/${{ env.CARGO_PROFILE }}/zluda
    - name: Set revision hash
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: zluda-linux-${{ env.SHORT_SHA }}
        path: target/${{ env.CARGO_PROFILE }}/zluda
    - name: Prepare artifact for release
      run: |
        mv target/${{ env.CARGO_PROFILE }}/zluda.tar.gz target/${{ env.CARGO_PROFILE }}/zluda-linux-${{ env.SHORT_SHA }}.tar.gz
        latest_tag=$(git tag -l "v*" | grep -E "^v[0-9]+$" | sort -V | tail -n 1)
        next_version="$((${latest_tag:1} + 1))"
        offset=$(git rev-list $latest_tag..HEAD --count)
        echo "VERSION=$next_version-preview.$offset" >> $GITHUB_OUTPUT
      id: prepare_artifacts
    - uses: ncipollo/release-action@v1
      with:
        prerelease: true
        generateReleaseNotes: true
        allowUpdates: true
        omitNameDuringUpdate: true
        artifacts: "target/${{ env.CARGO_PROFILE }}/zluda-linux-${{ env.SHORT_SHA }}.tar.gz"
        name: "Version ${{ steps.prepare_artifacts.outputs.VERSION }}"
        tag: "v${{ steps.prepare_artifacts.outputs.VERSION }}"
  build_windows:
    if: github.ref != 'refs/heads/experiment/physx-diagnostics'
    name: Build (Windows)
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      # fetch-depth and fetch-tags are required to properly tag pre-release builds
      with:
        fetch-depth: 0
        fetch-tags: true
        lfs: true
        submodules: true
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9
    - name: Build
      run: |
        cargo xtask zip --profile ${{ env.CARGO_PROFILE }}
        Expand-Archive -Path target/${{ env.CARGO_PROFILE }}/zluda.zip -DestinationPath target/${{ env.CARGO_PROFILE }}/zluda
        cargo xtask zip --profile ${{ env.CARGO_PROFILE }} --target=i686-pc-windows-msvc
        Expand-Archive -Path target/i686-pc-windows-msvc/${{ env.CARGO_PROFILE }}/zluda.zip -DestinationPath target/${{ env.CARGO_PROFILE }}/zluda/32
        Move-Item -Path target/${{ env.CARGO_PROFILE }}/zluda/32/zluda -Destination target/${{ env.CARGO_PROFILE }}/zluda/zluda/32
        Compress-Archive -Path target/${{ env.CARGO_PROFILE }}/zluda/zluda -DestinationPath target/${{ env.CARGO_PROFILE }}/zluda/upload.zip
    - name: Set revision hash
      run: echo "SHORT_SHA=$("${{ github.sha }}".SubString(0, 7))" >> $env:GITHUB_ENV
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: zluda-windows-${{ env.SHORT_SHA }}
        path: target/${{ env.CARGO_PROFILE }}/zluda
    - name: Prepare artifact for release
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        mv target/${{ env.CARGO_PROFILE }}/zluda/upload.zip target/${{ env.CARGO_PROFILE }}/zluda-windows-${{ env.SHORT_SHA }}.zip
        latest_tag=$(git tag -l "v*" | grep -E "^v[0-9]+$" | sort -V | tail -n 1)
        next_version="$((${latest_tag:1} + 1))"
        offset=$(git rev-list $latest_tag..HEAD --count)
        echo "VERSION=$next_version-preview.$offset" >> $GITHUB_OUTPUT
      id: prepare_artifacts
    - uses: ncipollo/release-action@v1
      with:
        prerelease: true
        generateReleaseNotes: true
        allowUpdates: true
        omitNameDuringUpdate: true
        artifacts: "target/${{ env.CARGO_PROFILE }}/zluda-windows-${{ env.SHORT_SHA }}.zip"
        name: "Version ${{ steps.prepare_artifacts.outputs.VERSION }}"
        tag: "v${{ steps.prepare_artifacts.outputs.VERSION }}"
  build_tests:
    if: github.ref != 'refs/heads/experiment/physx-diagnostics'
    name: Build AMD GPU unit tests
    runs-on: gpu_small
    outputs:
      test_package: ${{ steps.upload_artifacts.outputs.artifact-id }}
    steps:
    - uses: jlumbroso/free-disk-space@v1.3.1
    - name: Install build tools
      run: |
        sudo apt update
        sudo apt install -y git git-lfs build-essential cmake
    - uses: actions/checkout@v4
      with:
        lfs: true
        submodules: true
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        rustflags: ""
    - name: Install ROCm
      run: sudo bash .github/workflows/rocm_setup_build.sh ${{ env.ROCM_VERSION }} ${{ env.AMDGPU_VERSION }}
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-export
    - name: Build
      run: |
        cargo export target/tests -- test --features ci_build --workspace \
          --exclude cuda_macros \
          --exclude ptx_parser_macros \
          --exclude zluda_inject \
          --exclude zluda_redirect \
          --exclude zluda32 \
          --exclude zluda64_server \
          --exclude zluda_server_common \
          --exclude nvapi \
          --exclude nvapi_trace
        mkdir -p target/amdgpu
        bash .github/workflows/move_tests.sh target/tests amdgpu
        strip target/amdgpu/*
    - name: Upload
      id: upload_artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tests
        path: target/amdgpu
        retention-days: 7
  run_tests:
    if: github.ref != 'refs/heads/experiment/physx-diagnostics'
    name: Run AMD GPU unit tests
    runs-on: gpu_small
    needs: [build_tests]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
        sparse-checkout: .github
    - name: Install ROCm
      run: sudo bash .github/workflows/rocm_setup_run.sh ${{ env.ROCM_VERSION }} ${{ env.AMDGPU_VERSION }}
    - uses: actions/download-artifact@v4
      with:
        artifact-ids: ${{ needs.build_tests.outputs.test_package }}
        path: target
    - name: Run tests
      run: |
        chmod +x target/tests/*
        error_occurred=0
        for exe in target/tests/*; do
            ./"$exe" _amdgpu || { error_occurred=1; true; }
        done
        exit $error_occurred

  physx_diagnostics:
    name: Build PhysX diagnostic server (Windows)
    if: github.ref == 'refs/heads/experiment/physx-diagnostics'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # This small server build does not need the full LLVM compiler toolchain.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc,i686-pc-windows-msvc
      - name: Test Windows installer and rollback
        run: python -B -m unittest discover -s tools/physx/tests -p "test_*.py"
      - name: Test portable diagnostic aggregation
        shell: pwsh
        run: |
          rustc --edition=2021 --test zluda64_server/src/diagnostics.rs -o "$env:RUNNER_TEMP/physx-diagnostics-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/physx-diagnostics-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test texture request classification
        shell: pwsh
        run: |
          rustc --edition=2021 --test zluda64_server/src/texture_diagnostics.rs -o "$env:RUNNER_TEMP/texture-diagnostics-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/texture-diagnostics-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test restored texture deferral and kernel analysis
        shell: pwsh
        run: |
          cargo test --locked --release -p zluda64_server --target x86_64-pc-windows-msvc --features physx-texture-reuse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build control and diagnostic servers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/control, artifacts/diagnostic, artifacts/32 | Out-Null
          cargo build --locked --release -p zluda64_server --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/x86_64-pc-windows-msvc/release/zluda64_server.exe artifacts/control/
          cargo build --locked --release -p zluda64_server --target x86_64-pc-windows-msvc --features physx-texture-reuse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/x86_64-pc-windows-msvc/release/zluda64_server.exe artifacts/diagnostic/
      - name: Test allocation range cache
        shell: pwsh
        run: |
          rustc --edition=2021 --test zluda32/src/range_cache.rs -o "$env:RUNNER_TEMP/range-cache-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/range-cache-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test reusable kernel launch arguments
        shell: pwsh
        run: |
          rustc --edition=2021 --test zluda64_server/src/launch_params.rs -o "$env:RUNNER_TEMP/launch-params-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/launch-params-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test texture metadata cache
        shell: pwsh
        run: |
          rustc --edition=2021 --test zluda32/src/texture_metadata.rs -o "$env:RUNNER_TEMP/texture-metadata-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/texture-metadata-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test reusable proxy launch buffers
        shell: pwsh
        run: |
          rustc --edition=2021 --test zluda32/src/launch_args.rs -o "$env:RUNNER_TEMP/proxy-launch-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/proxy-launch-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build matching 32-bit proxy
        shell: pwsh
        run: |
          cargo build --locked --release -p zluda32 --target i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/i686-pc-windows-msvc/release/nvcuda.dll artifacts/32/
      - name: Record provenance and usage
        shell: pwsh
        run: |
          @(
            "Commit: $env:GITHUB_SHA"
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "Target: x86_64-pc-windows-msvc; profile: release; Cargo.lock: --locked"
            "Configuration: windows-texref-cache-v1"
            "Control: features omitted; diagnostic: physx-texture-reuse enabled"
            "Current installation: texture deferral and transfer deferral ON, range cache ON, diagnostics OFF; Windows server with original owned transfer serialization. Pool removed."
            (rustc --version)
            (cargo --version)
            ""
            "Experimental servers and matching 32-bit proxy, not a complete Proton tool."
            "Install 32/nvcuda.dll together with either server: their embedded Git revisions MUST match. Keep the original v7-preview.15 64-bit nvcuda.dll in a SEPARATE experimental tool."
            "Preserve the original tool, prefix, saves and working COMGR library."
            "For the diagnostic server set ZLUDA_PHYSX_DIAGNOSTICS to a NEW Wine-visible CSV base path (server adds .pid-N.csv)."
            "Without that variable collection is disabled. Existing output files are never overwritten."
            "Windows build/unit tests do not establish GPU or game correctness."
          ) | Set-Content artifacts/README.txt
          Get-ChildItem artifacts -Recurse -File | Where-Object { $_.Extension -in ".exe", ".dll" } | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path artifacts).Path.Length + 1)
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $relative
          } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: physx-servers-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      # Build the unmodified upstream bridge with the same runner/toolchain as ours.
      # Keep this pinned until the benchmark is complete; updating master is separate.
      - uses: actions/checkout@v4
        with:
          repository: vosen/ZLUDA
          ref: 86ec0a93cc83ba5b52e645892523e339dfa884f7
          path: reference-source
      - name: Build unmodified upstream reference bridge
        shell: pwsh
        working-directory: reference-source
        run: |
          cargo build --locked --release -p zluda64_server --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release -p zluda32 --target i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ../reference-artifacts/control, ../reference-artifacts/diagnostic, ../reference-artifacts/32 | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/zluda64_server.exe ../reference-artifacts/control/
          Copy-Item target/x86_64-pc-windows-msvc/release/zluda64_server.exe ../reference-artifacts/diagnostic/
          Copy-Item target/i686-pc-windows-msvc/release/nvcuda.dll ../reference-artifacts/32/
          @(
            "Commit: 86ec0a93cc83ba5b52e645892523e339dfa884f7"
            "Configuration: windows-reference-86ec0a9-v1"
            "Unmodified upstream Windows bridge; same base as the PhysX changes."
            "Both server copies are identical, with no optional features."
            "Comparison covers the 32/64-bit bridge, not a different HIP, Proton or 64-bit ZLUDA runtime."
            (rustc --version)
            (cargo --version)
          ) | Set-Content ../reference-artifacts/README.txt
          Get-ChildItem ../reference-artifacts -Recurse -File | Where-Object { $_.Extension -in ".exe", ".dll" } | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path ../reference-artifacts).Path.Length + 1)
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $relative
          } | Set-Content ../reference-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: physx-reference-${{ github.sha }}
          path: reference-artifacts/
          if-no-files-found: error
          retention-days: 14
